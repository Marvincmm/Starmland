<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倒计时 · Starmland 工具箱</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.cd-display { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; }
.cd-cell { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 22px 10px; text-align: center; }
.cd-cell .num { font-size: 2.2rem; font-weight: 700; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cd-cell .unit { color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; }
.cd-done { text-align: center; font-size: 1.4rem; color: #4ade80; margin-top: 20px; display: none; }
</style>
</head>
<body>
<div class="stars"></div>

<nav>
  <div class="nav-inner">
    <a class="logo" href="../index.html">⭐ Starmland</a>
    <div class="nav-links">
      <a href="../index.html">首页</a>
      <a href="index.html" class="active">工具</a>
      <a href="../skills.html">AI Skills</a>
    </div>
  </div>
</nav>

<main class="tool-wrap">
  <h1>⏳ 倒计时</h1>
  <p class="desc">选一个目标日期，看看还剩多少天（数据仅保存在本页）。</p>
  <div style="display:flex; gap:12px; flex-wrap:wrap;">
    <input type="datetime-local" id="target" style="flex:1; min-width:220px;">
    <button class="btn" onclick="startCountdown()" style="width:auto;">开始</button>
  </div>
  <div class="cd-display">
    <div class="cd-cell"><div class="num" id="d">--</div><div class="unit">天</div></div>
    <div class="cd-cell"><div class="num" id="h">--</div><div class="unit">时</div></div>
    <div class="cd-cell"><div class="num" id="m">--</div><div class="unit">分</div></div>
    <div class="cd-cell"><div class="num" id="s">--</div><div class="unit">秒</div></div>
  </div>
  <div class="cd-done" id="done">🎉 时间到！</div>
</main>

<script>
let timer = null;
function startCountdown() {
  const v = document.getElementById('target').value;
  if (!v) { alert('请先选择目标日期时间'); return; }
  const target = new Date(v).getTime();
  if (isNaN(target)) { alert('无效日期'); return; }
  clearInterval(timer);
  document.getElementById('done').style.display = 'none';
  function update() {
    const diff = target - Date.now();
    if (diff <= 0) {
      clearInterval(timer);
      ['d','h','m','s'].forEach(id => document.getElementById(id).textContent = '0');
      document.getElementById('done').style.display = 'block';
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor(diff % 86400000 / 3600000);
    const m = Math.floor(diff % 3600000 / 60000);
    const s = Math.floor(diff % 60000 / 1000);
    document.getElementById('d').textContent = d;
    document.getElementById('h').textContent = String(h).padStart(2, '0');
    document.getElementById('m').textContent = String(m).padStart(2, '0');
    document.getElementById('s').textContent = String(s).padStart(2, '0');
  }
  update();
  timer = setInterval(update, 1000);
}
</script>
</body>
</html>
