<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算器 · Starmland 工具箱</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.calc { max-width: 360px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
.calc-screen { background: rgba(0,0,0,0.35); border-radius: 10px; padding: 14px 16px; text-align: right; margin-bottom: 14px; min-height: 76px; display: flex; flex-direction: column; justify-content: center; }
.calc-expr { color: var(--text-dim); font-size: 0.9rem; min-height: 1.3em; word-break: break-all; }
.calc-current { font-size: 1.9rem; font-weight: 600; word-break: break-all; }
.calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.calc-keys button { padding: 16px 0; font-size: 1.1rem; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: var(--text); cursor: pointer; transition: background 0.15s; }
.calc-keys button:hover { background: rgba(255,255,255,0.12); }
.calc-keys .op { color: var(--accent2); }
.calc-keys .eq { background: var(--grad); border: none; color: #fff; }
.calc-keys .wide { grid-column: span 2; }
</style>
</head>
<body>
<div class="stars"></div>

<nav>
  <div class="nav-inner">
    <a class="logo" href="../index.html">⭐ Starmland</a>
    <div class="nav-links">
      <a href="../index.html">首页</a>
      <a href="index.html" class="active">工具</a>
      <a href="../skills.html">AI Skills</a>
    </div>
  </div>
</nav>

<main class="tool-wrap">
  <h1>🧮 计算器</h1>
  <p class="desc">四则运算，支持键盘输入（数字、+ - * /、回车等于、Esc 清空）。</p>
  <div class="calc">
    <div class="calc-screen">
      <div class="calc-expr" id="expr"></div>
      <div class="calc-current" id="current">0</div>
    </div>
    <div class="calc-keys">
      <button onclick="clearAll()" class="op">C</button>
      <button onclick="backspace()">⌫</button>
      <button onclick="addOp('%')" class="op">%</button>
      <button onclick="addOp('/')" class="op">÷</button>
      <button onclick="addDigit('7')">7</button>
      <button onclick="addDigit('8')">8</button>
      <button onclick="addDigit('9')">9</button>
      <button onclick="addOp('*')" class="op">×</button>
      <button onclick="addDigit('4')">4</button>
      <button onclick="addDigit('5')">5</button>
      <button onclick="addDigit('6')">6</button>
      <button onclick="addOp('-')" class="op">−</button>
      <button onclick="addDigit('1')">1</button>
      <button onclick="addDigit('2')">2</button>
      <button onclick="addDigit('3')">3</button>
      <button onclick="addOp('+')" class="op">+</button>
      <button onclick="addDigit('0')" class="wide">0</button>
      <button onclick="addDigit('.')">.</button>
      <button onclick="equals()" class="eq">=</button>
    </div>
  </div>
</main>

<script>
let current = '0', expr = '', justEvaluated = false;
const curEl = document.getElementById('current'), exprEl = document.getElementById('expr');
function render() { curEl.textContent = current; exprEl.textContent = expr; }
function addDigit(d) {
  if (justEvaluated) { current = '0'; expr = ''; justEvaluated = false; }
  if (d === '.' && current.includes('.')) return;
  current = current === '0' && d !== '.' ? d : current + d;
  render();
}
function addOp(op) {
  if (justEvaluated) { expr = current + ' '; justEvaluated = false; }
  else expr += current + ' ';
  current = op === '%' ? '%' : op;
  // 把运算符并入表达式，等待下一个数字
  expr += op === '%' ? '' : op + ' ';
  if (op === '%') { /* percent treated as operator appended after number below */ }
  render();
}
function equals() {
  const full = (expr + current).replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');
  if (!/^[-+*/%.()\d\s]+$/.test(full)) { curEl.textContent = '错误'; return; }
  try {
    let result = Function('"use strict"; return (' + full.replace(/%/g, '/100') + ')')();
    if (result === undefined || Number.isNaN(result) || !Number.isFinite(result)) throw 0;
    exprEl.textContent = full + ' =';
    current = String(Math.round(result * 1e10) / 1e10);
    expr = '';
    justEvaluated = true;
    curEl.textContent = current;
  } catch (e) { curEl.textContent = '错误'; }
}
function clearAll() { current = '0'; expr = ''; justEvaluated = false; render(); }
function backspace() {
  if (justEvaluated) { justEvaluated = false; }
  current = current.length > 1 ? current.slice(0, -1) : '0';
  render();
}
function render() { curEl.textContent = current; exprEl.textContent = expr; }
document.addEventListener('keydown', e => {
  if (/^[0-9]$/.test(e.key)) addDigit(e.key);
  else if (e.key === '.') addDigit('.');
  else if (['+','-','*','/'].includes(e.key)) addOp(e.key);
  else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
  else if (e.key === 'Escape') clearAll();
  else if (e.key === 'Backspace') backspace();
});
</script>
</body>
</html>
