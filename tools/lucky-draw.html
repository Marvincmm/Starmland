<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日抽签 · Starmland 工具箱</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.draw-stage { text-align: center; padding: 30px 0 10px; }
.draw-emoji { font-size: 4rem; display: none; animation: pop 0.5s ease; }
@keyframes pop { 0% { transform: scale(0.3); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
.draw-result { font-size: 1.5rem; font-weight: 700; margin-top: 14px; min-height: 2.2em; }
.draw-note { color: var(--text-dim); margin-top: 8px; }
</style>
</head>
<body>
<div class="stars"></div>

<nav>
  <div class="nav-inner">
    <a class="logo" href="../index.html">⭐ Starmland</a>
    <div class="nav-links">
      <a href="../index.html">首页</a>
      <a href="index.html" class="active">工具</a>
      <a href="../skills.html">AI Skills</a>
    </div>
  </div>
</nav>

<main class="tool-wrap" style="text-align:center;">
  <h1>🔮 今日抽签</h1>
  <p class="desc">纯属娱乐，好运常在。每天可以抽一次。</p>
  <div class="draw-stage">
    <div class="draw-emoji" id="emoji">🌟</div>
    <div class="draw-result" id="result">点击下方按钮，抽取今日运势</div>
    <p class="draw-note" id="note"></p>
  </div>
  <div style="margin-top:24px;">
    <button class="btn" id="draw-btn" onclick="draw()">✨ 抽一签</button>
  </div>
</main>

<script>
const FORTUNES = [
  { level: '大吉', emoji: '🌟', text: '星运昌隆，今天适合推进搁置已久的计划！', color: '#4ade80' },
  { level: '大吉', emoji: '🚀', text: '灵感如流星雨，写代码一遍过！', color: '#4ade80' },
  { level: '中吉', emoji: '🌱', text: '稳步向前，小步快跑也能抵达终点。', color: '#a78bfa' },
  { level: '中吉', emoji: '📖', text: '适合学习新东西，今天记住的都忘不掉。', color: '#a78bfa' },
  { level: '小吉', emoji: '☕', text: '节奏放慢一点，喝杯咖啡，好事在路上。', color: '#94a3b8' },
  { level: '小吉', emoji: '🤝', text: '会遇到愿意帮你的人，大胆开口。', color: '#94a3b8' },
  { level: '平', emoji: '🌤️', text: '平稳的一天，适合整理与复盘。', color: '#94a3b8' },
  { level: '吉', emoji: '💡', text: '一个点子会突然冒出来，记得记下来！', color: '#a78bfa' }
];
const NOTES = [
  '宜：动手写代码 · 忌：熬夜',
  '宜：早点睡 · 忌：纠结半天选哪个框架',
  '宜：喝水 · 忌：忘记 git push',
  '宜：散步十分钟 · 忌：跟自己较劲',
  '宜：整理桌面 · 忌：开太多浏览器标签页'
];
function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function draw() {
  const btn = document.getElementById('draw-btn');
  btn.disabled = true; btn.textContent = '🔮 占卜中...';
  const emojiEl = document.getElementById('emoji');
  emojiEl.style.display = 'none';
  setTimeout(() => {
    const seed = todayKey().split('-').reduce((a, b) => a + Number(b), 0) + Math.floor(Math.random() * 1000);
    const f = FORTUNES[seed % FORTUNES.length];
    const n = NOTES[seed % NOTES.length];
    emojiEl.textContent = f.emoji;
    emojiEl.style.display = 'block';
    emojiEl.style.animation = 'none'; void emojiEl.offsetWidth; emojiEl.style.animation = '';
    const r = document.getElementById('result');
    r.textContent = f.level + ' · ' + f.text;
    r.style.color = f.color;
    document.getElementById('note').textContent = n;
    btn.disabled = false; btn.textContent = '✨ 再抽一签';
  }, 700);
}
</script>
</body>
</html>
