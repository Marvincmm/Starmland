<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 格式化 · Starmland 工具箱</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="stars"></div>

<nav>
  <div class="nav-inner">
    <a class="logo" href="../index.html">⭐ Starmland</a>
    <div class="nav-links">
      <a href="../index.html">首页</a>
      <a href="index.html" class="active">工具</a>
      <a href="../skills.html">AI Skills</a>
    </div>
  </div>
</nav>

<main class="tool-wrap">
  <h1>📋 JSON 格式化</h1>
  <p class="desc">粘贴 JSON 文本，支持格式化、压缩与语法校验。全部在浏览器本地完成。</p>
  <textarea id="input" placeholder='{"name": "Starmland", "tools": ["json", "timestamp"]}'></textarea>
  <div class="tool-actions">
    <button class="btn" onclick="formatJson(2)">格式化（2 空格）</button>
    <button class="btn" onclick="formatJson(4)">格式化（4 空格）</button>
    <button class="btn btn-ghost" onclick="minify()">压缩</button>
    <button class="btn btn-ghost" onclick="clearAll()">清空</button>
  </div>
  <div id="status"></div>
  <div class="result-box" id="output" style="display:none;"></div>
</main>

<script>
function parse() {
  const text = document.getElementById('input').value.trim();
  const status = document.getElementById('status');
  if (!text) { status.innerHTML = '<span class="msg-error">请先输入 JSON 内容</span>'; return null; }
  try { return JSON.parse(text); }
  catch (e) {
    status.innerHTML = '<span class="msg-error">✗ 语法错误：' + e.message + '</span>';
    return null;
  }
}
function formatJson(indent) {
  const obj = parse();
  if (obj === null) return;
  document.getElementById('status').innerHTML = '<span class="msg-ok">✓ JSON 有效</span>';
  const out = document.getElementById('output');
  out.style.display = 'block';
  out.textContent = JSON.stringify(obj, null, indent);
}
function minify() {
  const obj = parse();
  if (obj === null) return;
  document.getElementById('status').innerHTML = '<span class="msg-ok">✓ 压缩完成</span>';
  const out = document.getElementById('output');
  out.style.display = 'block';
  out.textContent = JSON.stringify(obj);
}
function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('output').style.display = 'none';
  document.getElementById('status').innerHTML = '';
}
</script>
</body>
</html>
