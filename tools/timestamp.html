<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间戳转换 · Starmland 工具箱</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="stars"></div>

<nav>
  <div class="nav-inner">
    <a class="logo" href="../index.html">⭐ Starmland</a>
    <div class="nav-links">
      <a href="../index.html">首页</a>
      <a href="index.html" class="active">工具</a>
      <a href="../skills.html">AI Skills</a>
    </div>
  </div>
</nav>

<main class="tool-wrap">
  <h1>⏱️ 时间戳转换</h1>
  <p class="desc">Unix 时间戳与日期时间双向转换（本地时区）。</p>

  <div class="card" style="margin-bottom:28px;">
    <h3 style="margin-bottom:10px;">当前时间戳</h3>
    <div class="result-box" id="now-box" style="margin-top:0;">-</div>
    <p style="color:var(--text-dim); font-size:0.85rem; margin-top:8px;">每秒自动刷新（本地时区）</p>
  </div>

  <h3 style="margin-bottom:10px;">时间戳 → 日期</h3>
  <div style="display:flex; gap:12px; flex-wrap:wrap;">
    <input type="text" id="ts-input" placeholder="如 1770000000 或 1770000000000" style="flex:1; min-width:220px;">
    <button class="btn" onclick="tsToDate()" style="width:auto;">转换</button>
  </div>
  <div class="result-box" id="ts-out" style="display:none;"></div>

  <h3 style="margin:28px 0 10px;">日期 → 时间戳</h3>
  <div style="display:flex; gap:12px; flex-wrap:wrap;">
    <input type="datetime-local" id="date-input" style="flex:1; min-width:220px;">
    <button class="btn" onclick="dateToTs()" style="width:auto;">转换</button>
  </div>
  <div class="result-box" id="date-out" style="display:none;"></div>
</main>

<script>
function pad(n) { return String(n).padStart(2, '0'); }
function fmt(d) {
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' '
    + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function tickNow() {
  const now = new Date();
  document.getElementById('now-box').textContent =
    '秒级：' + Math.floor(now.getTime()/1000) + '\n毫秒级：' + now.getTime() + '\n日期：' + fmt(now);
}
tickNow(); setInterval(tickNow, 1000);

function show(id, text) {
  const el = document.getElementById(id);
  el.style.display = 'block';
  el.textContent = text;
}
function tsToDate() {
  const v = document.getElementById('ts-input').value.trim();
  if (!/^\d+$/.test(v)) { show('ts-out', '✗ 请输入纯数字时间戳'); return; }
  let ms = Number(v);
  if (v.length <= 10) ms *= 1000;
  const d = new Date(ms);
  if (isNaN(d.getTime())) { show('ts-out', '✗ 无效时间戳'); return; }
  show('ts-out', '本地时间：' + fmt(d) + '\nISO 8601：' + d.toISOString());
}
function dateToTs() {
  const v = document.getElementById('date-input').value;
  if (!v) { show('date-out', '✗ 请先选择日期时间'); return; }
  const ms = new Date(v).getTime();
  show('date-out', '秒级：' + Math.floor(ms/1000) + '\n毫秒级：' + ms);
}
</script>
</body>
</html>
